[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
dependencies = [
    "torch>=2.7",
    "transformers>=4.52,<4.53",  # transformers>=4.53 does not support torch.export
    "pydantic>=2.11",
    "tabulate>=0.9.0",
    "datasets>=3.6",
    "lm_eval==0.4.9",
    "accelerate>=1.9.0",
    "hadamard-transform>=0.1.3",
    "pillow>=11.3.0",
    "torchvision>=0.23",
    "openai",
    "dotenv",
    "einops",
    "gradio",
    "imageio",
    "json_repair",
    "matplotlib",
    "omegaconf",
    "opencv-python>=4.7.0.72",
    "openpyxl",
    "pandas",
    "pillow",
    "portalocker",
    "protobuf",
    "python-dotenv",
    "rich",
    "sentencepiece",
    "setuptools",
    "sty",
    "sympy",
    "tabulate",
    "tiktoken",
    "timeout-decorator",
    "transformers",
    "typing_extensions",
    "validators",
    "xlsxwriter",
    "pycocoevalcap>=1.2",
    "qwen-vl-utils[decord]==0.0.8",
    "ipdb>=0.13",
    "bitsandbytes",
    "wheel",
    "hatchling",
    "editables",
    "platformdirs",
]

name = "GenAIQuant"
version = "0.4.1"
description = "Python package for LLM Quantization Tooling"
readme = "README.md"
requires-python = ">=3.11"
[project.optional-dependencies]
fast = [
    "fast-hadamard-transform @ git+https://github.com/Dao-AILab/fast-hadamard-transform.git"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "pyright>=1.1",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["GenAIQuant"]

[tool.hatch.build.targets.sdist]
include = ["GenAIQuant"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
select = ["E", "F", "I", "C4", "RUF"]
exclude = [
    "build/",
    "GenAIQuant/evaluation/metrics/vlmevalkit"
]
ignore = []

[tool.pyrefly]
infer-with-first-use = false
