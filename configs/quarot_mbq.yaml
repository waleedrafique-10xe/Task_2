device: cuda
evaluation:
    tasks:
        MMMU_DEV_VAL:
            class: MMMUDataset
            dataset: MMMU_DEV_VAL
output_dir: output/quarot_mbq
quantization:
    outlier_reduction:
        algorithm: QuaRot
        online: false
    pipeline:
        - outlier_reduction
        - qat
    qat:
        algorithm: EfficientQat
        calib_dataset: redpajama
        train_size: 4096
        train_size_in_memory: 1024
        val_size: 64
        training_seqlen: 4096
        batch_size: 2
        seed: 2
        wbits: 4
        group_size: 64
        quant_lr: 1.0e-4
        weight_lr: 1.0e-5
        min_lr_factor: 20
        wd: 0
        early_stop: 0
        cache_dir: ./cache/EfficientQAT/
        net: null
        off_load_to_disk: false
        real_quant: false
        save_quant_dir: true
        clip_grad: 0.3
        e2e: {}
        mbq:
            enabled: true
            dataset_name: AIMClab-RUC/COCO-CN
            batch_size: 2
            epochs: 2
            wbits: 4
            group_size: 64
            kd_enabled: true
            tau: 0.7
            kd_weight: 1.0
            vision_weight: 0.1
            language_weight: 1.0
            reweight: true
            train_size: 4096
            val_size: 64
            vision_token_ids: []
            teacher_device: cuda
            vision_bitwidth_overrides: {}
